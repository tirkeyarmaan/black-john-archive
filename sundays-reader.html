
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reading Room | Black John's Archive</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101827;
  color: #dce6f1;
  font-family: Georgia, serif;
  transition: background 0.3s;
}

.topbar {
  padding: 13px;
  text-align: center;
  background: linear-gradient(#344e6b, #172639);
  border-bottom: 3px ridge #7088a5;
  color: #c6e3ff;
  font-family: monospace;
  letter-spacing: 2px;
  font-size: 11px;
}

.progress-track {
  height: 4px;
  background: #29394d;
}

#progress {
  height: 4px;
  width: 0%;
  background: #8dc8f0;
}

.container {
  max-width: 850px;
  margin: 30px auto;
  padding: 15px;
}

.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

button, select {
  padding: 9px 12px;
  background: #263d58;
  color: #dceeff;
  border: 2px outset #7893b0;
  font-family: monospace;
  cursor: pointer;
}

button:hover {
  background: #3c5c7e;
}

.paper {
  background: #e5e2d9;
  color: #292b30;
  padding: clamp(22px, 6vw, 55px);
  border: 5px ridge #aab1ba;
  box-shadow: 0 8px 30px #0008;
  min-height: 500px;
}

.paper h1 {
  text-align: center;
  font-size: clamp(26px, 5vw, 38px);
  font-weight: normal;
  line-height: 1.3;
  color: #253b55;
}

.chapter-number {
  text-align: center;
  font-family: monospace;
  letter-spacing: 3px;
  color: #64788e;
  font-size: 12px;
}

#chapter-content {
  margin-top: 35px;
  font-size: 19px;
  line-height: 1.9;
}

#chapter-content p {
  margin: 0 0 22px;
  text-indent: 25px;
}

.navigation {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 20px;
}

.navigation button {
  min-width: 120px;
}

.back {
  display: inline-block;
  margin-top: 25px;
  color: #a9c9e8;
  text-decoration: none;
  font-family: monospace;
  font-size: 12px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #8195aa;
  font-family: monospace;
  font-size: 11px;
}

body.focus-mode .topbar,
body.focus-mode .controls,
body.focus-mode .navigation,
body.focus-mode .back,
body.focus-mode footer {
  display: none;
}

body.focus-mode .container {
  max-width: 760px;
  margin-top: 45px;
}

@media(max-width: 600px) {
  .container {
    margin: 15px auto;
    padding: 10px;
  }

  .paper {
    min-height: 400px;
  }

  #chapter-content {
    font-size: 17px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  BLACK JOHN'S ARCHIVE // PRIVATE READING ROOM
</div>

<div class="progress-track">
  <div id="progress"></div>
</div>

<div class="container">

  <div class="controls">
    <select id="chapter-select" onchange="changeChapter(this.value)">
      <option value="1">Chapter 01 — The Letter</option>
      <option value="2">Chapter 02 — The Unexpected Question</option>
      <option value="3">Chapter 03 — Christmas Season</option>
    </select>

    <div>
      <button onclick="changeFont(-1)">A−</button>
      <button onclick="changeFont(1)">A+</button>
      <button onclick="toggleFocus()">FOCUS</button>
    </div>
  </div>

  <article class="paper">

    <div class="chapter-number" id="chapter-number">
      CHAPTER 01
    </div>

    <h1 id="chapter-title">The Letter</h1>

    <div id="chapter-content">
      <p>Loading your story...</p>
    </div>

  </article>

  <div class="navigation">
    <button id="previous" onclick="navigate(-1)">← PREVIOUS</button>
    <button id="next" onclick="navigate(1)">NEXT →</button>
  </div>

  <a class="back" href="sundays.html">
    ← BACK TO CHAPTER ARCHIVE
  </a>

</div>

<footer>
  BLACK JOHN'S ARCHIVE<br>
  READ SLOWLY. MASTERPIECES TAKE TIME.
</footer>

<script>
const chapters = {
  1: {
    title: "chapter 1",
    file: "chapters/sundays-chapter1.html"
  },
  2: {
    title: "Chapter 2",
    file: "chapters/sundays-chapter2.html"
  },
  3: {
    title: "Chapter 3",
    file: "chapters/sundays-chapter3.html"
  }
};

let currentChapter = 1;
let fontSize = 19;

async function loadChapter(number) {
  const chapter = chapters[number];

  if (!chapter) return;

  currentChapter = Number(number);

  document.getElementById("chapter-select").value = number;
  document.getElementById("chapter-number").textContent =
    "CHAPTER " + String(number).padStart(2, "0");

  document.getElementById("chapter-title").textContent =
    chapter.title;

  document.getElementById("chapter-content").innerHTML =
    "<p>Loading chapter...</p>";

  try {
    const response = await fetch(chapter.file);

    if (!response.ok) {
      throw new Error("Chapter not found");
    }

    const html = await response.text();

    document.getElementById("chapter-content").innerHTML = html;

  } catch (error) {
    document.getElementById("chapter-content").innerHTML =
      "<p>This chapter is not available yet. Please check back later.</p>";
  }

  document.getElementById("previous").disabled =
    currentChapter === 1;

  document.getElementById("next").disabled =
    currentChapter === 3;

  history.replaceState(null, "", "?chapter=" + currentChapter);

  window.scrollTo(0, 0);
  updateProgress();
}

function changeChapter(number) {
  loadChapter(Number(number));
}

function navigate(direction) {
  const nextChapter = currentChapter + direction;

  if (chapters[nextChapter]) {
    loadChapter(nextChapter);
  }
}

function changeFont(amount) {
  fontSize += amount;

  fontSize = Math.max(14, Math.min(28, fontSize));

  document.getElementById("chapter-content").style.fontSize =
    fontSize + "px";
}

function toggleFocus() {
  document.body.classList.toggle("focus-mode");
}

function updateProgress() {
  const scrollable =
    document.documentElement.scrollHeight -
    document.documentElement.clientHeight;

  const progress = scrollable > 0
    ? (window.scrollY / scrollable) * 100
    : 0;

  document.getElementById("progress").style.width =
    Math.min(100, progress) + "%";
}

window.addEventListener("scroll", updateProgress);

const params = new URLSearchParams(window.location.search);
const requestedChapter = Number(params.get("chapter")) || 1;

loadChapter(chapters[requestedChapter] ? requestedChapter : 1);
</script>

</body>
</html>
