
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Room | Black John's Archive</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101820;
  color: #e8edf0;
  font-family: Georgia, serif;
  transition: .25s;
}

header {
  height: 60px;
  padding: 0 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #09121b;
  border-bottom: 1px solid #263d4c;
  font-family: Arial, sans-serif;
}

.logo {
  color: #78e4f2;
  font-weight: bold;
  letter-spacing: 1px;
  font-size: 13px;
}

header a {
  color: #b9d5e2;
  text-decoration: none;
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 12px;
  background: #111e29;
  border-bottom: 1px solid #263d4c;
  font-family: Arial, sans-serif;
}

button, select {
  padding: 8px 12px;
  background: #1c3444;
  color: #dffaff;
  border: 1px solid #456477;
  border-radius: 5px;
  cursor: pointer;
}

.progress {
  height: 3px;
  background: #263d4c;
  position: sticky;
  top: 0;
  z-index: 6;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: #78e4f2;
}

.book {
  max-width: 760px;
  margin: 65px auto;
  padding: 0 30px;
}

.chapter-label {
  color: #78e4f2;
  text-transform: uppercase;
  letter-spacing: 3px;
  font: 12px Arial, sans-serif;
}

h1 {
  font-size: 38px;
  font-weight: normal;
  line-height: 1.3;
  margin: 15px 0 35px;
}

#content {
  font-size: 20px;
  line-height: 1.9;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.navigation {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  margin-top: 60px;
  padding: 25px 0;
  border-top: 1px solid #263d4c;
}

.navigation a {
  color: #78e4f2;
  text-decoration: none;
  font-family: Arial, sans-serif;
}

body.paper {
  background: #f4f0e7;
  color: #302b25;
}

body.paper header,
body.paper .toolbar {
  background: #e8e0d2;
  border-color: #c9bca9;
}

body.paper header a,
body.paper .logo {
  color: #554a3d;
}

body.paper button,
body.paper select {
  background: #e1d6c5;
  color: #302b25;
  border-color: #b5a58e;
}

body.sepia {
  background: #eee1c6;
  color: #493923;
}

body.sepia header,
body.sepia .toolbar {
  background: #ddc9a5;
}

body.sepia button,
body.sepia select {
  background: #d6c29e;
  color: #493923;
}

body.focus header {
  display: none;
}

body.focus .toolbar {
  opacity: .25;
}

body.focus .toolbar:hover {
  opacity: 1;
}

@media(max-width:600px) {
  .book { margin: 40px auto; padding: 0 23px; }
  h1 { font-size: 30px; }
  #content { font-size: 19px; }
  .toolbar { gap: 7px; }
  button, select { padding: 8px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">BLACK JOHN'S ARCHIVE</div>
  <a href="index.html">← Library</a>
</header>

<div class="toolbar">
  <button onclick="changeFont(-1)">A−</button>
  <button onclick="changeFont(1)">A+</button>

  <select id="theme" onchange="changeTheme(this.value)">
    <option value="dark">Dark</option>
    <option value="paper">Paper</option>
    <option value="sepia">Sepia</option>
  </select>

  <button onclick="toggleFocus()">Focus mode</button>
  <select id="chapters" onchange="goChapter(this.value)">
    <option value="1">Chapter 1</option>
    <option value="2">Chapter 2</option>
    <option value="3">Chapter 3</option>
    <option value="4">Chapter 4</option>
    <option value="5">Chapter 5</option>
    <option value="6">Chapter 6</option>
    <option value="7">Chapter 7</option>
    <option value="8">Chapter 8</option>
  </select>
</div>

<div class="progress">
  <div id="progressBar"></div>
</div>

<main class="book">
  <div class="chapter-label" id="chapterLabel">Chapter 1</div>
  <h1 id="chapterTitle">Loading chapter...</h1>

  <article id="content">
    Please wait...
  </article>

  <div class="navigation">
    <a id="previous" href="#">← Previous</a>
    <a id="next" href="#">Next →</a>
  </div>
</main>

<script>
const params = new URLSearchParams(location.search);
let chapter = Math.min(8, Math.max(1,
  parseInt(params.get("chapter")) || 1
));

let fontSize = 20;

function changeFont(amount) {
  fontSize = Math.max(14, Math.min(32, fontSize + amount));
  document.getElementById("content").style.fontSize =
    fontSize + "px";
}

function changeTheme(theme) {
  document.body.classList.remove("paper", "sepia");
  if (theme !== "dark") {
    document.body.classList.add(theme);
  }
  localStorage.setItem("archiveTheme", theme);
}

function toggleFocus() {
  document.body.classList.toggle("focus");
}

function goChapter(number) {
  location.href = "reader.html?chapter=" + number;
}

function updateProgress() {
  const scrollable =
    document.documentElement.scrollHeight - innerHeight;

  const progress = scrollable > 0
    ? scrollY / scrollable * 100
    : 0;

  document.getElementById("progressBar").style.width =
    progress + "%";

  localStorage.setItem("chapterProgress" + chapter, scrollY);
}

async function loadChapter() {
  document.getElementById("chapters").value = chapter;
  document.getElementById("chapterLabel").textContent =
    "Chapter " + chapter;

  document.getElementById("previous").style.visibility =
    chapter === 1 ? "hidden" : "visible";

  document.getElementById("next").style.visibility =
    chapter === 8 ? "hidden" : "visible";

  document.getElementById("previous").href =
    "reader.html?chapter=" + (chapter - 1);

  document.getElementById("next").href =
    "reader.html?chapter=" + (chapter + 1);

  try {
    const response = await fetch("chapters/chapter" + chapter + ".html");

    if (!response.ok) throw new Error("Chapter not found");

    const text = await response.text();

    document.getElementById("chapterTitle").textContent =
      "Chapter " + chapter;

    document.getElementById("content").innerHTML = text;

    setTimeout(() => {
      window.scrollTo(0, Number(
        localStorage.getItem("chapterProgress" + chapter) || 0
      ));
      updateProgress();
    }, 100);

  } catch (error) {
    document.getElementById("chapterTitle").textContent =
      "Chapter not found";

    document.getElementById("content").textContent =
      "We couldn't load this chapter. Please check its file location.";
  }
}

document.addEventListener("scroll", updateProgress);
document.getElementById("theme").value =
  localStorage.getItem("archiveTheme") || "dark";

changeTheme(document.getElementById("theme").value);
loadChapter();
</script>

</body>
</html>
