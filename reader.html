<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Room | Black John's Archive</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #10141c;
  --panel: #1b222e;
  --panel-light: #293544;
  --text: #e5e9ef;
  --muted: #9baabd;
  --accent: #8deaff;
  --border: #46586a;
  --glow: rgba(90, 210, 255, .15);
}

body {
  margin: 0;
  background:
    radial-gradient(ellipse at 50% 0%, #263747 0%, transparent 55%),
    linear-gradient(145deg, #10141c, #151c27 55%, #0b1119);
  color: var(--text);
  font-family: Georgia, serif;
  min-height: 100vh;
  transition: background .3s, color .3s;
}

/* TOP HEADER */

header {
  min-height: 66px;
  padding: 0 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(180deg, #303d4c, #151e2a);
  border-bottom: 1px solid #627789;
  box-shadow: 0 3px 15px #0008;
  font-family: Arial, sans-serif;
}

.logo {
  color: var(--accent);
  font-weight: bold;
  letter-spacing: 2px;
  font-size: 12px;
  text-shadow: 0 0 12px #58cfff88;
}

header a {
  color: #d2e8f4;
  text-decoration: none;
  font-size: 13px;
}

header a:hover {
  color: var(--accent);
}

/* READING TOOLBAR */

.toolbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 13px;
  background: rgba(18, 27, 39, .94);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 5px 18px #0005;
  font-family: Arial, sans-serif;
}

button, select {
  padding: 9px 13px;
  background: linear-gradient(180deg, #40566a, #1b2a3a);
  color: #e6f8ff;
  border: 1px solid #718da2;
  border-radius: 3px;
  box-shadow: inset 0 1px 1px #ffffff30, 0 2px 5px #0006;
  cursor: pointer;
  font-size: 12px;
  transition: .2s;
}

button:hover, select:hover {
  background: linear-gradient(180deg, #52748b, #243d52);
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--glow);
}

button:active {
  transform: translateY(1px);
}

/* READING PROGRESS */

.progress {
  height: 3px;
  background: #283746;
  position: sticky;
  top: 57px;
  z-index: 6;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #5a9dff, #8deaff, #c8faff);
  box-shadow: 0 0 10px #72dfff;
  transition: width .1s;
}

/* BOOK AREA */

.book {
  max-width: 820px;
  margin: 65px auto;
  padding: 55px 65px;
  background: linear-gradient(145deg, #1c2633dd, #131b26ee);
  border: 1px solid #53677a;
  border-top-color: #91a9bb;
  border-left-color: #70879a;
  box-shadow:
    inset 0 1px 0 #ffffff18,
    inset 0 0 35px #8bdfff08,
    0 15px 45px #0008;
  position: relative;
}

.book::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #a5eaff, transparent);
  opacity: .6;
}

.chapter-label {
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 4px;
  font: 11px Arial, sans-serif;
  margin-bottom: 18px;
  text-shadow: 0 0 10px #67dfff66;
}

h1 {
  color: #f0f3f7;
  font-family: Georgia, serif;
  font-size: 39px;
  font-weight: normal;
  line-height: 1.25;
  margin: 0 0 40px;
  padding-bottom: 25px;
  border-bottom: 1px solid #526273;
  text-shadow: 0 2px 12px #0008;
}

#content {
  font-size: 20px;
  line-height: 1.95;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #d8e0e9;
}

/* BOTTOM NAVIGATION */

.navigation {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  margin-top: 65px;
  padding: 25px 0 0;
  border-top: 1px solid #526273;
  font-family: Arial, sans-serif;
}

.navigation a {
  color: var(--accent);
  text-decoration: none;
  font-size: 13px;
  padding: 10px 15px;
  background: linear-gradient(180deg, #34495c, #1a2938);
  border: 1px solid #627d91;
  box-shadow: inset 0 1px #ffffff22;
}

.navigation a:hover {
  background: #344e65;
  box-shadow: 0 0 12px var(--glow);
}

/* PAPER THEME */

body.paper {
  background: #d7d2c9;
  color: #302b25;
}

body.paper header,
body.paper .toolbar {
  background: linear-gradient(180deg, #eee8dc, #d5cbb9);
  border-color: #a99b85;
}

body.paper header a,
body.paper .logo {
  color: #554a3d;
  text-shadow: none;
}

body.paper button,
body.paper select {
  background: linear-gradient(180deg, #f5eddf, #d8cbb6);
  color: #302b25;
  border-color: #a99a81;
}

body.paper .book {
  background: #f5f0e6;
  border-color: #b8aa93;
  box-shadow: 0 10px 35px #665b4930;
}

body.paper h1 {
  color: #302b25;
  border-color: #c9bca9;
  text-shadow: none;
}

body.paper #content {
  color: #302b25;
}

body.paper .chapter-label,
body.paper .navigation a {
  color: #746044;
  text-shadow: none;
}

body.paper .navigation {
  border-color: #c9bca9;
}

body.paper .navigation a {
  background: #e8dfd0;
  border-color: #b5a58e;
}

/* SEPIA THEME */

body.sepia {
  background: #c9b58e;
  color: #493923;
}

body.sepia header,
body.sepia .toolbar {
  background: linear-gradient(180deg, #e6d3ad, #cbb58d);
  border-color: #aa9169;
}

body.sepia header a,
body.sepia .logo {
  color: #493923;
  text-shadow: none;
}

body.sepia button,
body.sepia select {
  background: linear-gradient(180deg, #ead8b5, #cbb58d);
  color: #493923;
  border-color: #a9916a;
}

body.sepia .book {
  background: #eee1c6;
  border-color: #b9a27b;
  box-shadow: 0 10px 35px #55442c33;
}

body.sepia h1,
body.sepia #content {
  color: #493923;
  text-shadow: none;
}

body.sepia h1,
body.sepia .navigation {
  border-color: #c7b38e;
}

body.sepia .chapter-label,
body.sepia .navigation a {
  color: #795b31;
  text-shadow: none;
}

body.sepia .navigation a {
  background: #dfcba5;
  border-color: #b9a27b;
}

/* FOCUS MODE */

body.focus header {
  display: none;
}

body.focus .toolbar {
  opacity: .2;
  transition: opacity .3s;
}

body.focus .toolbar:hover {
  opacity: 1;
}

/* MOBILE */

@media(max-width: 700px) {
  header {
    padding: 0 20px;
  }

  .book {
    margin: 30px 12px;
    padding: 35px 24px;
  }

  h1 {
    font-size: 30px;
  }

  #content {
    font-size: 18px;
    line-height: 1.85;
  }

  .toolbar {
    gap: 7px;
    padding: 10px 6px;
  }

  button, select {
    padding: 8px 9px;
    font-size: 11px;
  }

  .navigation a {
    padding: 9px 10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">BLACK JOHN'S ARCHIVE</div>
  <a href="index.html">← BACK TO LIBRARY</a>
</header>

<div class="toolbar">
  <button onclick="changeFont(-1)">A−</button>
  <button onclick="changeFont(1)">A+</button>

  <select id="theme" onchange="changeTheme(this.value)">
    <option value="dark">Dark</option>
    <option value="paper">Paper</option>
    <option value="sepia">Sepia</option>
  </select>

  <button onclick="toggleFocus()">Focus mode</button>

  <select id="chapters" onchange="goChapter(this.value)">
    <option value="1">Chapter 1</option>
    <option value="2">Chapter 2</option>
    <option value="3">Chapter 3</option>
    <option value="4">Chapter 4</option>
    <option value="5">Chapter 5</option>
    <option value="6">Chapter 6</option>
    <option value="7">Chapter 7</option>
    <option value="8">Chapter 8</option>
  </select>
</div>

<div class="progress">
  <div id="progressBar"></div>
</div>

<main class="book">
  <div class="chapter-label" id="chapterLabel">Chapter 1</div>
  <h1 id="chapterTitle">Loading chapter...</h1>

  <article id="content">
    Please wait...
  </article>

  <div class="navigation">
    <a id="previous" href="#">← Previous</a>
    <a id="next" href="#">Next →</a>
  </div>
</main>

<script>
const params = new URLSearchParams(location.search);
let chapter = Math.min(8, Math.max(1,
  parseInt(params.get("chapter")) || 1
));

let fontSize = 20;

function changeFont(amount) {
  fontSize = Math.max(14, Math.min(32, fontSize + amount));
  document.getElementById("content").style.fontSize =
    fontSize + "px";
}

function changeTheme(theme) {
  document.body.classList.remove("paper", "sepia");
  if (theme !== "dark") {
    document.body.classList.add(theme);
  }
  localStorage.setItem("archiveTheme", theme);
}

function toggleFocus() {
  document.body.classList.toggle("focus");
}

function goChapter(number) {
  location.href = "reader.html?chapter=" + number;
}

function updateProgress() {
  const scrollable =
    document.documentElement.scrollHeight - innerHeight;

  const progress = scrollable > 0
    ? scrollY / scrollable * 100
    : 0;

  document.getElementById("progressBar").style.width =
    progress + "%";

  localStorage.setItem("chapterProgress" + chapter, scrollY);
}

async function loadChapter() {
  document.getElementById("chapters").value = chapter;
  document.getElementById("chapterLabel").textContent =
    "Chapter " + chapter;

  document.getElementById("previous").style.visibility =
    chapter === 1 ? "hidden" : "visible";

  document.getElementById("next").style.visibility =
    chapter === 8 ? "hidden" : "visible";

  document.getElementById("previous").href =
    "reader.html?chapter=" + (chapter - 1);

  document.getElementById("next").href =
    "reader.html?chapter=" + (chapter + 1);

  try {
    const response = await fetch("chapters/chapter" + chapter + ".html");

    if (!response.ok) throw new Error("Chapter not found");

    const text = await response.text();

    document.getElementById("chapterTitle").textContent =
      "Chapter " + chapter;

    document.getElementById("content").innerHTML = text;

    setTimeout(() => {
      window.scrollTo(0, Number(
        localStorage.getItem("chapterProgress" + chapter) || 0
      ));
      updateProgress();
    }, 100);

  } catch (error) {
    document.getElementById("chapterTitle").textContent =
      "Chapter not found";

    document.getElementById("content").textContent =
      "We couldn't load this chapter. Please check its file location.";
  }
}

document.addEventListener("scroll", updateProgress);
document.getElementById("theme").value =
  localStorage.getItem("archiveTheme") || "dark";

changeTheme(document.getElementById("theme").value);
loadChapter();
</script>

</body>
</html>
